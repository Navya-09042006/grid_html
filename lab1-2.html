<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        text-align: center;
        transform: translate(10%, 50%);
      }
      body {
        display: flex;
        margin-top: 50px;
        justify-content: center;
      }
      #box {
        display: grid;
        grid-template-columns: repeat(6, 39px);
        gap: 1px;
        row-gap: 3px;
      }
      #p1 {
        background-color: darkgreen;
        width: 1cm;
        height: 1cm;
      }
      #p2 {
        background-color: blueviolet;
        width: 1cm;
        height: 1cm;
      }
      #p3 {
        background-color: aqua;
        width: 1cm;
        height: 1cm;
      }
    </style>
  </head>
  <body>
    <div id="box">
      <div id="p1">1</div>
      <div id="p2">2</div>
      <div id="p3">3</div>
      <div id="p1">1</div>
      <div id="p2">2</div>
      <div id="p3">3</div>

      <div id="p2">2</div>
      <div id="p3">3</div>
      <div id="p1">1</div>
      <div id="p2">2</div>
      <div id="p3">3</div>
      <div id="p1">1</div>

      <div id="p3">3</div>
      <div id="p1">1</div>
      <div id="p2">2</div>
      <div id="p3">3</div>
      <div id="p1">1</div>
      <div id="p2">2</div>

      <div id="p1">1</div>
      <div id="p2">2</div>
      <div id="p3">3</div>
      <div id="p1">1</div>
      <div id="p2">2</div>
      <div id="p3">3</div>

      <div id="p2">2</div>
      <div id="p3">3</div>
      <div id="p1">1</div>
      <div id="p2">2</div>
      <div id="p3">3</div>
      <div id="p1">1</div>
    </div>
  </body>
</html>
